openapi: 3.0.3  
info:  
  title: User Service API  
  version: 1.0.0  
  
servers:  
  - url: /api/v1  
  
paths:  
  
  /auth/register:  
    post:  
      summary: Register new user  
      requestBody:  
        required: true  
        content:  
          application/json:  
            schema:  
              $ref: '#/components/schemas/RegisterRequest'  
      responses:  
        '201':  
          description: User created  
          content:  
            application/json:  
              schema:  
                $ref: '#/components/schemas/AuthResponse'  
  
  /auth/login:  
    post:  
      summary: Login user  
      requestBody:  
        required: true  
        content:  
          application/json:  
            schema:  
              $ref: '#/components/schemas/LoginRequest'  
      responses:  
        '200':  
          description: JWT tokens  
          content:  
            application/json:  
              schema:  
                $ref: '#/components/schemas/AuthResponse'  
  
  /users/me:  
    get:  
      summary: Get current user  
      security:  
        - bearerAuth: []  
      responses:  
        '200':  
          description: Current user profile  
          content:  
            application/json:  
              schema:  
                $ref: '#/components/schemas/UserResponse'  
  
  /users/{id}:  
    get:  
      summary: Get user by ID  
      security:  
        - bearerAuth: []  
      parameters:  
        - name: id  
          in: path  
          required: true  
          schema:  
            type: string  
      responses:  
        '200':  
          description: User profile  
          content:  
            application/json:  
              schema:  
                $ref: '#/components/schemas/UserResponse'  
  
  /users/me:  
    patch:  
      summary: Update current user  
      security:  
        - bearerAuth: []  
      requestBody:  
        content:  
          application/json:  
            schema:  
              $ref: '#/components/schemas/UpdateUserRequest'  
      responses:  
        '200':  
          description: Updated user  
          content:  
            application/json:  
              schema:  
                $ref: '#/components/schemas/UserResponse'  
  
  /companies:  
    post:  
      summary: Create company  
      security:  
        - bearerAuth: []  
      requestBody:  
        content:  
          application/json:  
            schema:  
              $ref: '#/components/schemas/CreateCompanyRequest'  
      responses:  
        '201':  
          description: Company created  
          content:  
            application/json:  
              schema:  
                $ref: '#/components/schemas/CompanyResponse'  
  
  /companies/{id}:  
    get:  
      summary: Get company  
      security:  
        - bearerAuth: []  
      parameters:  
        - name: id  
          in: path  
          required: true  
          schema:  
            type: string  
      responses:  
        '200':  
          description: Company info  
          content:  
            application/json:  
              schema:  
                $ref: '#/components/schemas/CompanyResponse'  
  
  /companies/{id}/users:  
    get:  
      summary: Get users in company  
      security:  
        - bearerAuth: []  
      parameters:  
        - name: id  
          in: path  
          required: true  
          schema:  
            type: string  
      responses:  
        '200':  
          description: Users list  
          content:  
            application/json:  
              schema:  
                $ref: '#/components/schemas/UserListResponse'  
  
components:  
  
  securitySchemes:  
    bearerAuth:  
      type: http  
      scheme: bearer  
      bearerFormat: JWT  
  
  schemas:  
  
    RegisterRequest:  
      type: object  
      required: [email, password, role]  
      properties:  
        email:  
          type: string  
        password:  
          type: string  
        role:  
          type: string  
          enum: [SELLER, BUYER, WAREHOUSE, LOGISTICS]  
  
    LoginRequest:  
      type: object  
      required: [email, password]  
      properties:  
        email:  
          type: string  
        password:  
          type: string  
  
    AuthResponse:  
      type: object  
      properties:  
        access_token:  
          type: string  
        refresh_token:  
          type: string  
  
    UserResponse:  
      type: object  
      properties:  
        id:  
          type: string  
        email:  
          type: string  
        role:  
          type: string  
        company_id:  
          type: string  
        created_at:  
          type: string  
          format: date-time  
  
    UpdateUserRequest:  
      type: object  
      properties:  
        email:  
          type: string  
  
    CreateCompanyRequest:  
      type: object  
      required: [name]  
      properties:  
        name:  
          type: string  
        description:  
          type: string  
  
    CompanyResponse:  
      type: object  
      properties:  
        id:  
          type: string  
        name:  
          type: string  
        description:  
          type: string  
  
    UserListResponse:  
      type: object  
      properties:  
        users:  
          type: array  
          items:  
            $ref: '#/components/schemas/UserResponse'